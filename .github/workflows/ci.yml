name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - run: uv sync --locked --dev
      - run: uv run --locked ruff check .

  unit:
    name: unit
    # The package is macOS-only and builds Swift helpers; the macOS 15 image's Swift compiler crashes on them.
    runs-on: macos-26-intel
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - run: uv sync --locked --dev
      - run: uv run --locked python -m unittest discover -s tests

  evals:
    name: evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: uv sync --locked --dev
      - name: Build MCP Eval from main
        run: |
          cargo install --locked --git https://github.com/cavi-ai/mcp-eval --branch main \
            --root "$RUNNER_TEMP/mcp-eval" mcpeval
          echo "MCPEVAL_EXECUTABLE=$RUNNER_TEMP/mcp-eval/bin/mcpeval" >> "$GITHUB_ENV"
          python3 - "$RUNNER_TEMP/mcp-eval/.crates2.json" >> "$GITHUB_ENV" <<'PYTHON'
          import json
          import re
          import sys
          with open(sys.argv[1]) as stream:
              installed = json.load(stream)["installs"]
          source = next(key for key in installed if key.startswith("mcpeval "))
          revision = source.rsplit("#", 1)[1].removesuffix(")")
          assert re.fullmatch("[0-9a-f]{40}", revision), source
          print(f"MCPEVAL_SOURCE_REVISION={revision}")
          PYTHON
          mkdir -p .tmp/evals/evaluator
          cp "$RUNNER_TEMP/mcp-eval/.crates2.json" .tmp/evals/evaluator/cargo-install.json
      - run: npm run eval
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mcp-eval-reports
          path: .tmp/evals/*/*.json
          if-no-files-found: error

  pin-consumers:
    # A green main moves the adobe-mcp pin in game-art-pipeline through its pin-servers workflow.
    needs: [lint, unit, evals]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require CAVI_DISPATCH_TOKEN
        env:
          TOKEN: ${{ secrets.CAVI_DISPATCH_TOKEN }}
        run: test -n "$TOKEN" || { echo "::error::Add the CAVI_DISPATCH_TOKEN repository secret"; exit 1; }
      - name: Dispatch server-merged to game-art-pipeline
        env:
          GH_TOKEN: ${{ secrets.CAVI_DISPATCH_TOKEN }}
        run: gh api repos/cavi-ai/game-art-pipeline/dispatches --method POST -f event_type=server-merged
