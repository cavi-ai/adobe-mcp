name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags give the documented release
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - run: uv sync --locked --dev
      - run: uv run --locked ruff check .
      - name: Build and verify the documentation
        if: hashFiles('scripts/docs/build.py') != ''
        run: |
          uv run --locked python -m scripts.docs.build
          uv run --locked python -m scripts.docs.verify

  unit:
    name: unit
    # The package is macOS-only and builds Swift helpers; the macOS 15 image's Swift compiler crashes on them.
    runs-on: macos-26-intel
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - run: uv sync --locked --dev
      - run: uv run --locked python -m unittest discover -s tests

  evals:
    name: evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: uv sync --locked --dev
      - name: Build MCP Eval from main
        run: |
          cargo install --locked --git https://github.com/cavi-ai/mcp-eval --branch main \
            --root "$RUNNER_TEMP/mcp-eval" mcpeval
          echo "MCPEVAL_EXECUTABLE=$RUNNER_TEMP/mcp-eval/bin/mcpeval" >> "$GITHUB_ENV"
          python3 - "$RUNNER_TEMP/mcp-eval/.crates2.json" >> "$GITHUB_ENV" <<'PYTHON'
          import json
          import re
          import sys
          with open(sys.argv[1]) as stream:
              installed = json.load(stream)["installs"]
          source = next(key for key in installed if key.startswith("mcpeval "))
          revision = source.rsplit("#", 1)[1].removesuffix(")")
          assert re.fullmatch("[0-9a-f]{40}", revision), source
          print(f"MCPEVAL_SOURCE_REVISION={revision}")
          PYTHON
          mkdir -p .tmp/evals/evaluator
          cp "$RUNNER_TEMP/mcp-eval/.crates2.json" .tmp/evals/evaluator/cargo-install.json
      - run: npm run eval
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mcp-eval-reports
          path: .tmp/evals/*/*.json
          if-no-files-found: error

  pin-consumers:
    # A green main opens the server pin pull request in each consumer.
    needs: [lint, unit, evals]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        consumer: [game-art-pipeline, cartoon-pipeline]
    steps:
      # Fine-grained token: contents read on the server repos; contents + pull requests write on the consumers.
      - name: Require CAVI_DISPATCH_TOKEN
        env:
          TOKEN: ${{ secrets.CAVI_DISPATCH_TOKEN }}
        run: test -n "$TOKEN" || { echo "::error::Add the CAVI_DISPATCH_TOKEN repository secret"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cavi-ai/${{ matrix.consumer }}
          token: ${{ secrets.CAVI_DISPATCH_TOKEN }}
          submodules: true
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - name: Server access for uv
        env:
          TOKEN: ${{ secrets.CAVI_DISPATCH_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/cavi-ai/".insteadOf "https://github.com/cavi-ai/"
      - name: Open the pin pull request
        env:
          GH_TOKEN: ${{ secrets.CAVI_DISPATCH_TOKEN }}
          CONSUMER: ${{ matrix.consumer }}
        # Consumer output stays out of this repository's logs.
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/pin-body.md"
          case "$CONSUMER" in
            game-art-pipeline)
              python3 scripts/servers.py sync > "$RUNNER_TEMP/sync.json" 2> /dev/null
              python3 -c 'import json, sys; sys.exit(0 if json.load(open(sys.argv[1]))["changed"] else 1)' "$RUNNER_TEMP/sync.json" || exit 0
              key=$(git submodule status | awk '{gsub(/^[-+U]/, "", $1); print substr($1, 1, 7)}' | paste -sd- -)
              python3 -c 'import json, sys; m = json.load(open(sys.argv[1]))["moved"]; print("\n".join("- %s %s -> %s" % (r, (v["from"] or "new")[:7], v["to"][:7]) for r, v in m.items()))' "$RUNNER_TEMP/sync.json" > "$body"
              paths=(.gitmodules pyproject.toml uv.lock servers plugin.json .claude-plugin .codex-plugin)
              ;;
            cartoon-pipeline)
              locked() {
                python3 -c 'import tomllib; names = {"cavi-adobe-mcp", "cavi-mcp-core", "cavi-character-animator-mcp"}; [print(p["name"], p["source"]["git"].rsplit("#", 1)[1]) for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] in names and "git" in p["source"]]'
              }
              locked > "$RUNNER_TEMP/before.txt"
              uv lock --upgrade-package cavi-adobe-mcp --upgrade-package cavi-mcp-core --upgrade-package cavi-character-animator-mcp > /dev/null 2>&1
              locked > "$RUNNER_TEMP/after.txt"
              git diff --quiet uv.lock && exit 0
              key=$(sha256sum uv.lock | cut -c1-12)
              python3 -c 'import sys; a = dict(l.split() for l in open(sys.argv[1])); b = dict(l.split() for l in open(sys.argv[2])); print("\n".join("- %s %s -> %s" % (n, (a.get(n) or "new")[:7], v[:7]) for n, v in b.items() if a.get(n) != v))' "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt" > "$body"
              paths=(uv.lock)
              ;;
          esac
          branch="bot/pin-servers-$key"
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null 2>&1; then
            echo "pin already proposed"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -c "$branch"
          git add -A -- "${paths[@]}"
          git commit -q -m "chore: pin servers to main"
          git push -q origin "$branch" > /dev/null 2>&1
          for old in $(gh pr list --state open --json number,headRefName -q '.[] | select(.headRefName | startswith("bot/pin-servers-")) | .number'); do
            gh pr close "$old" --delete-branch --comment "Superseded by a newer server pin." > /dev/null 2>&1
          done
          gh pr create --head "$branch" --title "chore: pin servers to main" --body-file "$body" > /dev/null
